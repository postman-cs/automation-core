name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Reconcile prior release
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -n "$LATEST" ] && ! gh release view "$LATEST" >/dev/null 2>&1; then
            ACTIVE="$(gh run list --workflow release.yml --branch "$LATEST" --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$ACTIVE" -eq 0 ]; then gh workflow run release.yml --ref "$LATEST"; fi
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.reconcile.outputs.blocked != 'true'
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
        if: steps.reconcile.outputs.blocked != 'true'
      - name: Plan release
        id: plan
        if: steps.reconcile.outputs.blocked != 'true'
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.json
        run: |
          set -euo pipefail
          node scripts/release-cut.mjs --plan | tee "$PLAN_FILE"
          echo "release=$(node -p "require(process.env.PLAN_FILE).release === true")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require(process.env.PLAN_FILE).version || ''")" >> "$GITHUB_OUTPUT"
      - name: Cut release
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release-cut.mjs --execute
      - name: Push release tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: git push origin "refs/tags/v${VERSION}"
      - name: Start or recover release workflow
        if: steps.reconcile.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_FILE: ${{ runner.temp }}/plan.json
        run: |
          set -euo pipefail
          TAG="$(node -p "const p=require(process.env.PLAN_FILE); p.release ? 'v' + p.version : (p.previous || '')")"
          if [ -n "$TAG" ] && ! gh release view "$TAG" >/dev/null 2>&1; then gh workflow run release.yml --ref "$TAG"; fi
